# jeecg-study · nginx 配置（前端静态托管 + 后端反代 + WebSocket）
#
# ⚠⚠ **nginx 在 Windows 下读不了带中文的路径**（实测 2026-11-05）：
#    `nginx.exe -c "D:/.../04-运营部署/01-部署文档/02-nginx.conf"` 会直接报
#    `CreateFile() ... failed (1113: No mapping for the Unicode character exists in the target multi-byte code page)`
#    ⇒ **本文件不能直接喂给 nginx**，必须先复制到**纯 ASCII 路径**（nginx 的 conf 目录）。
#    仓库里保留这一份是为了**版本化 / 评审**，运行时以 nginx conf 目录里那份为准。
#
# 用法（Windows，**走脚本，别手工拷**）：
#   & '.\02-代码开发\05-源码\04-建库迁移\start-nginx.ps1'          # 复制 + 校验 + 启动
#   & '.\02-代码开发\05-源码\04-建库迁移\start-nginx.ps1' -Stop   # 停止
#
# ⚠ **端口 8090 与本机另外几个站点（80 / 8581 / 8582 / 8583 / 8592）不冲突** ——
#   本机 nginx 已经托管着 jeecg-skiot / MyAsk / kkfileview / monitorV2，
#   本配置用**独立的 pid / 日志文件**，可以与它**并存运行**、互不干扰。
#
# ⚠ **改这三处**（换机器/换端口时）：
#   ① `root`（前端产物目录）；
#   ② `proxy_pass` 的后端地址与端口；
#   ③ `listen` 端口。
#   `include mime.types;` 是**相对路径** ⇒ 按「配置文件所在目录」解析
#   ⇒ 本文件被复制到 nginx 的 conf 目录后，正好能找到同目录的 mime.types。

worker_processes  1;

# 独立的 pid / 日志 ⇒ 与本机已在跑的 nginx 实例互不覆盖
pid        logs/nginx-jeecg.pid;
error_log  logs/error-jeecg.log  warn;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket 升级头：普通请求用 close，带 Upgrade 的请求才用 upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip  on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    access_log  logs/access-jeecg.log;

    client_body_temp_path  temp/client_body;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    uwsgi_temp_path        temp/uwsgi;
    scgi_temp_path         temp/scgi;

    server {
        listen       8090;
        server_name  localhost;

        # 前端产物（真实发布产物，不是 dev server）
        root  D:/DevProject/2-JavaPrj/20261030-jeecg-study/02-代码开发/05-源码/builds/latest/frontend/dist;
        index index.html;

        # SPA history 模式：刷新子页面必须回落 index.html，缺了直接 404
        location / {
            try_files $uri $uri/ /index.html;

            # 静态资源用 hash 文件名 + 长缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 7d;
                add_header Cache-Control "public";
            }
        }

        # 敏感路径不得落入 SPA 的 try_files 兜底
        location ~ /\.(env|git|svn|hg|aws|ssh|docker) {
            return 404;
        }

        # 安全加固：积木报表未授权 RCE 端点禁用
        location ~* ^/jeecg-?boot/jmreport/(auto/export|executeSelectApi|auto/show) {
            return 403 '{"code":403,"message":"Forbidden: endpoint disabled by security policy","success":false}';
        }

        # ===== 后端反代 =====
        # 前端的 VITE_GLOB_API_URL（所有接口请求的父前缀）与 VITE_GLOB_DOMAIN_URL
        # （上传 / 文件下载 / WebSocket）**都是相对路径 /jeecgboot** ⇒ 浏览器只认这一个前缀。
        # 后端的 context path 是 /jeecg-boot ⇒ 这里做一次前缀转换。
        location /jeecgboot/ {
            proxy_pass http://127.0.0.1:8590/jeecg-boot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # ⚠ WebSocket 升级：**没有这两行，顶部消息通知连不上**（E-52）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
            proxy_buffers 8 128k;
            proxy_buffer_size 256k;
        }

        # 后端自己在响应里回写的绝对路径（形如 /jeecg-boot/sys/common/static/…）要用得到 ⇒ 同样放行
        location /jeecg-boot/ {
            proxy_pass http://127.0.0.1:8590/jeecg-boot/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 30s;
            proxy_read_timeout 120s;
        }
    }
}
