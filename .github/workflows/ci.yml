# ============================================================================
# jeecg-study · 持续集成
#
# ## 设计要点
#
# ① **口令自生成，不依赖任何仓库 secret 或个人凭据**
#    在「启动 MySQL」这一步里用 `openssl rand -hex 24` 生成随机口令，
#    同时注入 MySQL 容器与 `DB_PASSWORD` 环境变量
#    （`application-test.yml` 里数据源口令就是 `${DB_PASSWORD:root}`，环境变量一注入就生效）。
#
# ② **口令不跨 job 传递**（2026-11-04 首跑失败的真正原因）
#    最初拆成 `prepare` job + job output 传递。实测 runner 会**跳过被掩码的值**：
#      [warning] Skip output 'db_password' since it may contain secret.
#    ⇒ 下游 job 拿到的是**空串** ⇒ MySQL 的 `MYSQL_ROOT_PASSWORD` 为空
#    ⇒ 容器启动即退出（首跑 13 秒就挂在 `Initialize containers`）。
#    现在改成**同一个 step 内生成并使用**，再经 `$GITHUB_ENV` 传给后续 step ——
#    env 文件是掩码值的标准传递通道，不受「跳过 output」规则影响。
#    配套：后续 step 开头有一步**显式断言** `DB_PASSWORD` 非空，坏了当场说清楚。
#
# ③ **MySQL 8 用显式 `docker run` 启动，不用 `services:`**
#    `services:` 的容器初始化是 GitHub 的**黑盒**——容器起不来时只给两行报错
#    （Failed to initialize container / One or more containers failed to start），
#    **容器自己的日志拿不到**（job log 要 admin 权限或登录才能看），
#    本地又没有 Docker 可复现 ⇒ 无从定位。
#    改成显式 `docker run` 之后：
#      - 就绪判据由我们自己写（真口令 + 真查询），不依赖 `mysqladmin ping`
#        （它对 Access denied 也返回 0，会把「服务起来了但口令不对」误判成就绪）；
#      - 失败时能把 `docker logs` 直接打进 job log，下一次不用再猜；
#      - 容器启动与基座还原解耦，各失败各归各。
#
# ④ **基座必须还原到仓库内原位**
#    `RedLineScanner.frontendRoot()` 按固定相对路径找前端源码，
#    基座若落在 /tmp，Java 侧全部前端断言会假红。详见
#    `.github/scripts/2026110402-ci-restore-base.sh` 的注释。
#
# ⑤ **不调用任何 .ps1**：CI 跑在 ubuntu-latest 上，建库走 bash 等价脚本
#    `.github/scripts/2026110403-ci-init-db.sh`。
#
# ⑥ **闸门真跑**：7 道 Python 闸门 + Java 单测 + 前端构建全部执行，
#    任何一道红都让 CI 变红。
# ============================================================================
name: jeecg-study CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消尚未跑完的旧 run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 主 job：起 MySQL → 还原基座 → 建库 → Java 测试 → Python 闸门 → 前端构建
  # ---------------------------------------------------------------------
  ci:
    name: 后端测试 + 闸门 + 前端构建
    runs-on: ubuntu-latest
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: jeecg-study
      MYSQL_USER: root
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # ⚠ 必须排在「还原基座」之前：
      #   容器拉镜像 + 初始化要十几秒。先起它，后面任何一步失败时，
      #   我们都已经在日志里拿到了 DB 的真实状态，而不是只知道「容器没起来」。
      - name: 启动 MySQL 8（生成口令 + 拉起 + 探活）
        run: |
          set -euo pipefail

          # ---- 生成随机口令 ----
          # 掩码后经 $GITHUB_ENV 传给后续 step（env 文件是掩码值的标准通道）。
          # ⚠ 绝不能靠 job output 传递：runner 会跳过被掩码的值（见文件头 ②）。
          if command -v openssl >/dev/null 2>&1; then
            pw="$(openssl rand -hex 24)"
          else
            pw="$(head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          fi
          if [ -z "$pw" ]; then
            echo "::error::随机口令生成为空"
            exit 1
          fi
          echo "::add-mask::$pw"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "随机口令已生成（长度 ${#pw}）"

          if ! command -v mysql >/dev/null 2>&1; then
            echo "==> 安装 mysql-client"
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi

          docker rm -f jeecg-study-mysql >/dev/null 2>&1 || true

          # ---- 先把宿主 3306 腾干净 ----
          # runner 镜像自带 MySQL（服务默认 disabled，这里仍显式停一次更保险）。
          # 端口被占 ⇒ `docker -p 3306:3306` 直接失败，容器**根本起不来**。
          if command -v systemctl >/dev/null 2>&1; then
            sudo systemctl stop mysql.service 2>/dev/null || true
            sudo systemctl disable mysql.service 2>/dev/null || true
          fi
          if (exec 3<>/dev/tcp/127.0.0.1/3306) 2>/dev/null; then
            echo "::error::宿主 3306 端口已被占用，容器端口映射不上去"
            sudo ss -ltnp 2>/dev/null | grep ':3306' || true
            exit 1
          fi

          # ---- 显式拉镜像（重试 3 次）----
          # 把「拉镜像失败」和「容器起不来」分成两条不同的错误。
          pull_ok=0
          for i in 1 2 3; do
            if docker pull mysql:8.0; then
              pull_ok=1
              break
            fi
            echo "拉取 mysql:8.0 第 ${i} 次失败，10 秒后重试"
            sleep 10
          done
          if [ "$pull_ok" != "1" ]; then
            echo "::error::mysql:8.0 镜像拉取失败（已重试 3 次）"
            exit 1
          fi

          # MYSQL_DATABASE **故意不设**：建库由 2026110403-ci-init-db.sh 负责，
          # 少一个环境变量就少一个「变量名/取值出错」的面。
          # MYSQL_ROOT_HOST=% ：runner 走宿主 3306 端口进来，容器看到的是
          # docker 网桥网关（不是 localhost），必须有 root@'%' 才能连上。
          docker run -d \
            --name jeecg-study-mysql \
            -e MYSQL_ROOT_PASSWORD="$pw" \
            -e MYSQL_ROOT_HOST='%' \
            -p 3306:3306 \
            mysql:8.0

          # ---- 口令走 defaults 文件，不进命令行 ----
          CNF="$(mktemp)"
          chmod 600 "$CNF"
          cat > "$CNF" <<EOF
          [client]
          host=127.0.0.1
          port=3306
          user=root
          password="$pw"
          EOF
          trap 'rm -f "$CNF"' EXIT

          # ---- 就绪探测：真口令 + 真查询 ----
          # 走 TCP 127.0.0.1:3306 —— MySQL 初始化阶段的临时服务器是
          # --skip-networking 的，TCP 不通 ⇒ 探测会自然地一直等到真正就绪为止。
          # 每轮先看容器还活着没有：容器退了（口令不对 / 初始化失败）就**立刻**
          # 带着退出码与日志退出，不白等满 120 秒。
          ready=0
          for i in $(seq 1 60); do
            if ! docker ps --filter name=jeecg-study-mysql --filter status=running -q | grep -q .; then
              echo "::error::MySQL 容器已退出（第 ${i} 次探测时）；容器现场："
              docker inspect jeecg-study-mysql \
                --format 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' || true
              docker logs --tail 80 jeecg-study-mysql 2>&1 || true
              exit 1
            fi
            if mysql --defaults-extra-file="$CNF" -N -B -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL 已就绪（第 ${i} 次探测）"
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" != "1" ]; then
            echo "::error::MySQL 120 秒内未就绪；以下是容器现场："
            docker ps -a --filter name=jeecg-study-mysql || true
            docker inspect jeecg-study-mysql \
              --format 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' || true
            docker logs --tail 80 jeecg-study-mysql 2>&1 || true
            exit 1
          fi

      # 掩码值经 $GITHUB_ENV 传递是否真的到位，当场验一次 ——
      # 坏了要看到一句明确的话，而不是下游 1045 / 找不到文件那种误导性报错。
      - name: 校验口令已传递到后续 step
        run: |
          set -euo pipefail
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::DB_PASSWORD 没有传到后续 step（掩码值经 job output 会被 runner 跳过；env 文件才是正确通道）"
            exit 1
          fi
          echo "DB_PASSWORD 已传递（长度 ${#DB_PASSWORD}）"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⚠ 必须在 setup-java / setup-node 之前：
      #   两者都要对基座里的 pom.xml / pnpm-lock.yaml 做缓存键计算，
      #   而基座要先还原出来这两个文件才存在。
      - name: 还原完整基座（仓库内原位）
        run: bash ".github/scripts/2026110402-ci-restore-base.sh"

      - name: 准备 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: "02-代码开发/05-源码/01-JeecgBoot基座/jeecgboot-vue3/pnpm-lock.yaml"

      - name: 建库 + 灌种子
        run: bash ".github/scripts/2026110403-ci-init-db.sh"

      - name: Java 测试（真连库）
        working-directory: 02-代码开发/05-源码/01-JeecgBoot基座/jeecg-boot
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -pl jeecg-boot-module/jeecg-module-study -am \
            test

      - name: Python 闸门（7 道）
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pymysql cryptography pyyaml
          python3 "05-公共资源/2026103013-交付物校验.py"
          python3 "05-公共资源/2026103016-红线断言检查.py"
          python3 "05-公共资源/2026103020-类名唯一性检查.py"
          python3 "05-公共资源/2026103023-凭据扫描.py"
          python3 "05-公共资源/2026110404-编码体检.py"
          python3 "05-公共资源/2026103021-唯一索引清单生成.py" --check
          python3 "05-公共资源/2026103015-追溯矩阵生成.py"

      # 用 `vite build` 而不是 `pnpm build`：后者在 vite 之后还串了
      # postBuild.ts / copyChat.ts 两个**打包发布**脚本（拷 chat 资源、
      # 生成部署目录），跟「代码能不能编译」无关，且依赖本地产物目录。
      # 这里要验的是 21 个新页面的编译与打包是否通过。
      #
      # NODE_ENV / NODE_OPTIONS 与基座 package.json 的 `build` 脚本保持一致：
      # runner 只有 4 核 16G，显式给堆上限比让 V8 自适应更稳。
      - name: 前端构建
        working-directory: 02-代码开发/05-源码/01-JeecgBoot基座/jeecgboot-vue3
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          # 先清产物目录：vite 会在构建开头把 outDir 整个清空，
          # 上万文件的删除突发是句柄耗尽（EMFILE）的主要来源之一。
          rm -rf dist
          pnpm install --frozen-lockfile
          pnpm exec vite build

      # 无论哪一步失败，都把 DB 容器现场留下来：
      # 首跑时最大的遗憾就是「只知道容器没起来，不知道它为什么没起来」。
      - name: 收尾：打印 DB 容器状态与日志
        if: always()
        run: |
          docker ps -a --filter name=jeecg-study-mysql || true
          docker logs --tail 40 jeecg-study-mysql 2>&1 || true
